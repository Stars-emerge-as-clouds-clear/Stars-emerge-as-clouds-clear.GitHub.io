<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站迁移通知</title>
    <link rel="shortcut icon" href="xz.云散皆星河.cn/windows1.gif" type="image/gif">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            color: #fff;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #6a0dad;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2rem;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background: #4a00e0;
        }
        .countdown {
            font-size: 1.2rem;
            margin-top: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>网站迁移通知</h1>
        <p>由于原域名不稳定，我们的网站已迁移到新的域名：<br><strong>koxzs.云散皆星河.cn</strong></p>
        <a href="https://koxzs.云散皆星河.cn" class="button">立即访问新网站</a>
        <div class="countdown">页面将在 <span id="countdown">5</span> 秒后自动跳转</div>
    </div>

    <script>
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');

        // 更新倒计时
        const countdownInterval = setInterval(() => {
            countdownElement.textContent = countdown;
            countdown--;

            if (countdown < 0) {
                clearInterval(countdownInterval);
                window.location.href = "https://koxzs.云散皆星河.cn";
            }
        }, 1000);
    </script>
</body>
</html>
